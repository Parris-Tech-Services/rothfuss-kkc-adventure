name: KKC production offline podcasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/podcast-data.js'
      - 'public/podcast-player.js'
      - 'public/podcast-sw.js'
      - 'tools/offline-podcast-production.mjs'
      - '.github/workflows/offline-podcast-production.yml'
permissions:
  contents: read
concurrency:
  group: kkc-offline-podcasts
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check public/podcast-player.js
      - run: node --check public/podcast-data.js
  prepare:
    runs-on: ubuntu-latest
    outputs:
      titles: ${{ steps.matrix.outputs.titles }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('public/podcast-data.js','utf8');
          const re=/\{ id: '([^']+)',(?: audio: "([^"]+)",)? title: (?:'([^']+)'|"([^"]+)"), show:/g;
          const titles=[...s.matchAll(re)].filter(m=>m[2]).map(m=>m[3]||m[4]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'titles='+JSON.stringify(titles)+'\n');
          NODE
  production-offline:
    needs: [build,prepare]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        title: ${{ fromJSON(needs.prepare.outputs.titles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y pulseaudio ffmpeg
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=offline_test
          pactl set-default-sink offline_test
      - run: node tools/offline-podcast-production.mjs
        env:
          EPISODE_TITLE: ${{ matrix.title }}
          PRODUCTION_URL: https://rothfuss-kkc-adventure.vercel.app/
          PULSE_SINK: offline_test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkc-offline-evidence-${{ strategy.job-index }}
          path: offline-evidence/
